<ion-header [translucent]="true">
  <app-header-inner-page
    [text]="'Door Access'"
    (typeOfUser)="onChangeTypeOfUser($event)"
  ></app-header-inner-page>
</ion-header>

<ion-content id="resident-content" [fullscreen]="true">
  <app-refresher-page (eventEmitter)="handleRefresh($event)"></app-refresher-page>
  <div class="w-full flex items-start justify-start mt-2 ml-3">
    <ion-icon
      name="arrow-back-circle"
      size="large"
      class="text-[var(--ion-color-primary)] size-12"
      (click)="onClickNav([true, 'home-page'])"
    ></ion-icon>
  </div>

  <div class="px-4 pb-4 space-y-2.5 pt-2">
    <div
      *ngFor="let door of intercomDoorAccessList"
      class="w-full bg-[#D8ECCF] p-4 rounded-xl flex items-center justify-between shadow-sm active:scale-[0.99] transition-transform cursor-pointer"
      (click)="onClickDoor(door)"
    >
      <div class="flex flex-col items-start pr-2">
        <h2 class="text-lg font-bold text-gray-800">
          <p class="capitalize">{{ door.name }}</p>
        </h2>
        <p class="text-sm text-gray-600">{{ door.position }}</p>
      </div>

      <!-- Access Mode Badge -->
      <div class="flex items-center shrink-0">
        <span
          *ngIf="door.door_access_mode === 'bluetooth'"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-100 text-blue-800 border border-blue-200"
        >
          <ion-icon name="bluetooth" class="text-sm text-blue-600"></ion-icon>
          Bluetooth
        </span>
        <span
          *ngIf="door.door_access_mode !== 'bluetooth'"
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-800 border border-green-200"
        >
          <ion-icon name="qr-code" class="text-sm text-green-700"></ion-icon>
          QR Code
        </span>
      </div>
    </div>
  </div>

  <div
    *ngIf="isLoading"
    class="flex justify-center items-center h-full !mt-[150px]"
  >
    <app-loading-animation *ngIf="isLoading"></app-loading-animation>
  </div>
</ion-content>

<ion-footer>
  <app-botton-nav-bar></app-botton-nav-bar>
</ion-footer>
