<ion-header [translucent]="true">
  <app-header-inner-page
    [text]="'Door Access'"
    (typeOfUser)="onChangeTypeOfUser($event)"
  ></app-header-inner-page>
</ion-header>

<ion-content id="resident-content" [fullscreen]="true">
  <app-refresher-page (eventEmitter)="handleRefresh($event)"></app-refresher-page>
  <div class="w-full flex items-center justify-between mt-2 px-3">
    <ion-icon
      name="arrow-back-circle"
      size="large"
      class="text-[var(--ion-color-primary)] size-12 cursor-pointer"
      (click)="onClickNav([true, 'home-page'])"
    ></ion-icon>

    <!-- Background Proximity Scanner Status Pill -->
    <div
      *ngIf="isBackgroundScanning"
      class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 border border-blue-200 text-blue-700 text-xs shadow-xs"
    >
      <span class="inline-block w-2 h-2 rounded-full bg-blue-500 animate-ping"></span>
      <ion-icon name="bluetooth" class="text-sm text-blue-600"></ion-icon>
      <span class="font-medium">Sensing doors nearby...</span>
    </div>
  </div>

  <div class="px-4 pb-4 space-y-3 pt-2">
    <div
      *ngFor="let door of intercomDoorAccessList"
      class="w-full bg-[#D8ECCF] p-4 rounded-xl flex items-center justify-between shadow-sm active:scale-[0.98] transition-all cursor-pointer border-2"
      [ngClass]="door.isInRange ? 'border-green-500 shadow-md ring-2 ring-green-200' : 'border-transparent'"
      (click)="onClickDoor(door)"
    >
      <div class="flex flex-col items-start pr-2">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <span class="capitalize">{{ door.name }}</span>
          <span
            *ngIf="door.isInRange"
            class="inline-block w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse"
            title="In Proximity"
          ></span>
        </h2>
        <p class="text-sm text-gray-600">{{ door.position }}</p>
        <span *ngIf="door.isInRange" class="text-xs text-green-700 font-semibold mt-0.5 flex items-center gap-1">
          <ion-icon name="radio" class="text-sm text-green-600"></ion-icon>
          Nearby (Tap to Open)
        </span>
      </div>

      <!-- Action / Mode Badge -->
      <div class="flex items-center shrink-0">
        <!-- Opening Spinner -->
        <div *ngIf="door.isOpening" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white text-green-800 border border-green-300">
          <ion-spinner name="crescent" color="primary" class="w-4 h-4"></ion-spinner>
          <span class="text-xs font-semibold">Opening...</span>
        </div>

        <ng-container *ngIf="!door.isOpening">
          <!-- Bluetooth Direct Open Button -->
          <button
            *ngIf="door.door_access_mode === 'bluetooth'"
            type="button"
            class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full text-xs font-bold transition-colors shadow-xs"
            [ngClass]="door.isInRange 
              ? 'bg-green-600 text-white hover:bg-green-700 active:bg-green-800' 
              : 'bg-blue-600 text-white hover:bg-blue-700 active:bg-blue-800'"
          >
            <ion-icon [name]="door.isInRange ? 'lock-open' : 'flash'" class="text-sm"></ion-icon>
            {{ door.isInRange ? 'Open Now' : 'Direct Open' }}
          </button>

          <!-- QR Code Badge -->
          <span
            *ngIf="door.door_access_mode !== 'bluetooth'"
            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-semibold bg-green-100 text-green-800 border border-green-200"
          >
            <ion-icon name="qr-code" class="text-sm text-green-700"></ion-icon>
            QR Code
          </span>
        </ng-container>
      </div>
    </div>
  </div>

  <div
    *ngIf="isLoading"
    class="flex justify-center items-center h-full !mt-[150px]"
  >
    <app-loading-animation *ngIf="isLoading"></app-loading-animation>
  </div>
</ion-content>

<ion-footer>
  <app-botton-nav-bar></app-botton-nav-bar>
</ion-footer>
