<app-resident-header [text]="'Notice'"/>
<ion-content [fullscreen]="true">
	<div class="w-full mt-2 flex items-start ml-4">
		<ion-icon name="arrow-back-circle" size="large" class="text-[var(--ion-color-primary)] size-12" [routerLink]="['/resident-home-page']"></ion-icon>
	</div>

  <div class="px-5 text-center mb-24">
		<div class="flex flex-row mt-2 justify-start items-center w-full space-x-3">
      <div class="w-full">
        <app-visitor-button [text]="'Notice'" [extraClass]="'bg-[var(--ion-color-primary)] text-white w-full leading-none'"></app-visitor-button>
      </div>
      <div class="w-full">
        <app-visitor-button [text]="'Docs'" [extraClass]="'bg-[#D0D0D0] text-[#757575] w-full'" [routerLink]="['/favourite-announcement']"></app-visitor-button>
      </div>
		</div>
		<div class="w-full space-y-3 mt-3 text-left">
      <div class="w-full mt-1">
        <select id="notice_filter" 
                class="border w-full rounded py-2 px-3 outline-[#BDBDBD] h-12 text-base text-[#6B7280]" 
                [(ngModel)]="newOrOld" 
                (change)="filtering()">
          <option disabled hidden value="">Filter by</option>
          <option value="all">All</option>
          <option value="new">Newest</option>
          <option value="old">Oldest</option>
          <option value="favourite">Favourites</option>
        </select>
      </div>
      <div *ngIf="isLoading" class="flex justify-center items-center h-[50%] mt-10">
        <ion-spinner name="circular"></ion-spinner>
      </div>
      <div *ngFor="let notice of notices">
        <div *ngIf="!isLoading" class="bg-[var(--ion-color-tertiary)] p-4 rounded-xl shadow-sm space-y-3">
          <div class="flex justify-between items-start gap-2">
            <h2 class="font-bold text-base leading-snug">
              {{ notice.notice_title }}
            </h2>
            <div class="shrink-0">
              <ion-icon *ngIf="notice.is_prioritize !== false; else notPriority" class="text-yellow-500 text-3xl cursor-pointer" name="star" (click)="prioritizeNotice(notice)">
              </ion-icon>
              <ng-template #notPriority>
                <div (click)="prioritizeNotice(notice)">
                  <ion-icon class="text-yellow-500 text-3xl cursor-pointer" name="star-outline">
                  </ion-icon>
                </div>
              </ng-template>
            </div>
          </div>

          <table class="w-full text-xs text-gray-700">
            <tr>
              <td class="pr-2 py-0.5 text-gray-500 w-16">
                Start
              </td>
              <td class="py-0.5 font-medium">
                : {{ functionMainService.convertToDDMMYYYY(notice.start_date) }}
              </td>
            </tr>
            <tr>
              <td class="pr-2 py-0.5 text-gray-500 w-16">
                End
              </td>
              <td class="py-0.5 font-medium">
                : {{ functionMainService.convertToDDMMYYYY(notice.end_date) }}
              </td>
            </tr>
          </table>

          <!-- Download Attachment Button (Elevated UP above notice content) -->
          <div *ngIf="notice.notice_attachment" class="pt-1">
            <button
              type="button"
              class="w-full bg-[var(--ion-color-primary)] text-white font-bold py-2.5 px-3 rounded-lg text-xs flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-transform"
              (click)="downloadAttachment(notice.notice_attachment)"
            >
              <ion-icon name="download-outline" class="text-base"></ion-icon>
              <span>Download Attachment</span>
            </button>
          </div>

          <div class="pt-1">
            <p class="text-sm text-gray-800 leading-relaxed whitespace-pre-wrap">
              {{ notice.notice_content }}
            </p>
          </div>
        </div>
      </div>
		</div>
	</div>
	<app-bottom-nav-bar></app-bottom-nav-bar>
</ion-content>
