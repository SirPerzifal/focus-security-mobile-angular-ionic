<ion-content [fullscreen]="true">
  <app-resident-header [is_client]="true" [text]="'Settings'" />
  <div class="w-full flex items-start justify-start mt-2 ml-3">
    <ion-icon
      name="arrow-back-circle"
      size="large"
      class="text-[var(--ion-color-primary)] size-12"
      [routerLink]="['/client-settings']"
    ></ion-icon>
  </div>

  <div class="body-of-faq">
    <!-- Page heading -->
    <div class="faq-heading">
      <h1 class="faq-title">Tutorial Videos</h1>
    </div>

    <!-- Loading skeletons -->
    <div *ngIf="isLoadingVideos" class="video-list">
      <div class="video-card skeleton-card" *ngFor="let i of [1,2,3]">
        <div class="thumbnail-wrapper skeleton-thumb"></div>
        <div class="video-info">
          <div class="skeleton-line long"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>
    </div>

    <!-- Error state -->
    <div *ngIf="!isLoadingVideos && videoError" class="error-state">
      <ion-icon name="alert-circle-outline" class="error-icon"></ion-icon>
      <p class="error-message">{{ videoError }}</p>
      <button class="retry-btn" (click)="loadTutorialVideos()">
        <ion-icon name="refresh-outline"></ion-icon> Retry
      </button>
    </div>

    <!-- Empty state -->
    <div
      *ngIf="!isLoadingVideos && !videoError && tutorialVideos.length === 0"
      class="empty-state"
    >
      <ion-icon name="videocam-outline" class="empty-icon"></ion-icon>
      <p>No tutorial videos available yet.</p>
    </div>

    <!-- Video list -->
    <div
      *ngIf="!isLoadingVideos && !videoError && tutorialVideos.length > 0"
      class="video-list"
    >
      <div
        class="video-card"
        *ngFor="let video of tutorialVideos"
        (click)="openVideo(video.secure_url)"
      >
        <!-- Thumbnail with play button overlay -->
        <div class="thumbnail-wrapper">
          <img
            *ngIf="video.thumbnail_url"
            [src]="video.thumbnail_url"
            [alt]="video.video_title || video.name"
            class="thumbnail-img"
          />
          <div *ngIf="!video.thumbnail_url" class="thumbnail-fallback">
            <ion-icon name="videocam-outline"></ion-icon>
          </div>
          <div class="play-overlay">
            <div class="play-btn">
              <ion-icon
                *ngIf="video.video_source === 'youtube'"
                name="play"
                class="yt-play-icon"
              ></ion-icon>
              <ion-icon
                *ngIf="video.video_source === 'nextcloud'"
                name="play"
                class="next-play-icon"
              ></ion-icon>
            </div>
          </div>
          <div *ngIf="video.video_source === 'youtube'" class="yt-badge">
            <ion-icon name="logo-youtube" class="yt-icon"></ion-icon>
            YouTube
          </div>
          <div *ngIf="video.video_source === 'nextcloud'" class="yt-badge">
            <ion-icon name="cloud-upload" class="next-icon"></ion-icon>
            Nextcloud
          </div>
        </div>

        <!-- Video info -->
        <div class="video-info">
          <p class="video-title-text">{{ video.video_title || video.name }}</p>
          <p class="video-name-label">{{ video.name }}</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<ion-footer>
  <app-bottom-nav-bar [clientRoute]="true"></app-bottom-nav-bar>
</ion-footer>
