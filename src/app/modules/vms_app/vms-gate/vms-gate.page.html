<ion-content [fullscreen]="true" class="vms-body">
  <app-refresher-page (eventEmitter)="handleRefresh($event)"></app-refresher-page>
  <div class="absolute inset-0 flex justify-center items-center opacity-20">
    <app-vms-background />
  </div>
  <div class="flex flex-col relative mt-2 mx-4">
    <div class="w-full">
      <app-vms-header [urlCustom]="'/home-vms'"/>
    </div>
    <div class="flex flex-row mt-8 mx-4">
      <div class="flex flex-col items-center">
        <app-button-icon [text]="'GATES'" [customImageIcon]="'assets/icon-vms/parking-barrier.png'" class="mt-4"
        [routerLink]="['/home-vms']" [isActive]="true" [disableClick]="true" />
      </div>
    </div>
    <div class="flex flex-row">
      <div class="mt-8 flex flex-col items-center mx-4 space-y-5 w-full mb-4">
        <div class="w-full">
          <app-m2m-selection [Arrays]="Camera" (outputValue)="onCameraChange($event)" [placeholder]="chooseLabel" [isOne]="true" [isVMS]="true"
            [labelText]="gateBarrierMode === 'both' ? 'GATE / BARRIER' : 'GATE'"></app-m2m-selection>
        </div>
        <div class="w-full">
          <app-visitor-button [text]="openButtonLabel" 
            [extraClass]="'bg-[var(--ion-color-primary)] text-white w-full text-2xl h-20 mt-1'"
            (click)="openGate(false, false)"></app-visitor-button>
        </div>
        <div class="w-full" *ngIf="canFreezeCurrentGate">
          <app-visitor-button [text]="'FREEZE GATE'" 
            [extraClass]="'bg-[#E58929] text-white w-full text-2xl h-20 mt-1'"
            (click)="freezeGate()"></app-visitor-button>
        </div>
        <div class="w-full">
          <app-visitor-button [text]="closeButtonLabel" 
            [extraClass]="'bg-[#C62828] text-white w-full text-2xl h-20 mt-1'"
            (click)="openGate(true, false)"></app-visitor-button>
        </div>
      </div>
    </div>
  </div>
  
</ion-content>
